name: Broken Link Checker

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC; compensates for ~4.5h runner queue delay to target ~10 AM IST actual execution
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout BrokenLinkChecker repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git for GitHub Pages push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Clone broken-links-reports repo for historical data
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Clone the reports repo to access historical archive data
          # This ensures lifetime stats and progress tracking work in CI
          git clone https://x-access-token:${GH_PAT}@github.com/sonatype-docs/broken-links-reports.git .github_pages_repo
          echo "✓ Cloned broken-links-reports repo with $(ls .github_pages_repo/archive/*.csv 2>/dev/null | wc -l) historical CSV files"

      - name: Run broken link checker
        env:
          DOCS_URLS: https://help.sonatype.com/en/sonatype-product-overview.html
          MAX_PAGES_PER_SITE: 0
          PARALLEL_WORKERS: 50
          ENABLE_GITHUB_UPLOAD: true
          GITHUB_USERNAME: sonatype-docs
          GITHUB_REPO_NAME: broken-links-reports
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          ENABLE_SLACK_NOTIFICATIONS: false
          EXCLUDE_PATTERNS: "https://help.sonatype.com/document/,https://help.sonatype.com/cdn-cgi/l/email-protection,http://your-host:8095/crowd,https://sso.your.domain/auth/realms/nexus,https://help.sonatype.com/en/404-page.html,https://repo1.dso.mil/dsop/sonatype/nexus/nexus,https://repo1.dso.mil/dsop/sonatype/nexus-iq-server/nexus-iq-server,https://github.com/samplecount/samplerepo,https://repo.sonatype.com/repository/sonatype-hosted/pki/deb-gpg/GPG-KEY-sonatype-apt-hosted.asc,urn:resource:component:,https://support.sonatype.com/hc/en-us/articles/1500000415082,https://plugins.jenkins.io/nexus-jenkins-plugin/,https://support.sonatype.com/hc/en-us/articles/4408801690515,https://support.sonatype.com/hc/en-us/articles/4409326330003,https://helm.ngc.nvidia.com/nvidia,https://registry-1.docker.io"
        run: python3 enhanced_link_checker.py 2>&1 | tee workflow_output.log

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

      - name: Upload workflow log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-log-${{ github.run_id }}
          path: workflow_output.log
          retention-days: 7
